<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Legal</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 24px; line-height: 1.55; }
      h1 { font-size: 24px; margin: 0 0 8px; }
      p { margin: 0 0 16px; opacity: 0.85; }
      .grid { display: grid; grid-template-columns: 1fr; gap: 12px; max-width: 720px; }
      .card { border: 1px solid rgba(255,255,255,0.16); border-radius: 14px; padding: 14px; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
      a.btn {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.22);
        text-decoration: none;
        color: inherit;
        opacity: 0.95;
      }
      a.btn:hover { opacity: 1; }
      .label { font-weight: 700; }
      .muted { opacity: 0.72; }
    </style>
  </head>
  <body>
    <h1>Legal / Yasal</h1>
    <p class="muted">Choose a document (TR/EN) / Belge seç (TR/EN)</p>

    <div class="grid">
      <div class="card">
        <div class="label">Terms of Service / Kullanım Koşulları</div>
        <div class="row">
          <a class="btn" href="./terms_tr.html">TR</a>
          <a class="btn" href="./terms_en.html">EN</a>
        </div>
      </div>

      <div class="card">
        <div class="label">Privacy Policy / Gizlilik Politikası</div>
        <div class="row">
          <a class="btn" href="./privacy_tr.html">TR</a>
          <a class="btn" href="./privacy_en.html">EN</a>
        </div>
      </div>

      <div class="card">
        <div class="label">About / Hakkında</div>
        <div class="row">
          <a class="btn" href="./about_tr.html">TR</a>
          <a class="btn" href="./about_en.html">EN</a>
        </div>
      </div>
    </div>
  </body>
</html>
